name: Build WB Package
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-package.yml'
      - 'installer/**'
      - 'packager/**'
      - 'tests/**'
  workflow_dispatch:
    inputs:
      version:
        required: true
        default: "0.1.0"
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -v
      - name: Wait for fresh server artifact
        env:
          GH_TOKEN: ${{ secrets.WB_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          EXPECTED="e35f786e9863d433c9e08f6be27dcfa10537bd8a"
          for i in $(seq 1 60); do
            SHA=$(gh api repos/an2an1970/wb.srv/releases --jq '.[0].target_commitish' || true)
            if [ "$SHA" = "$EXPECTED" ]; then exit 0; fi
            sleep 20
          done
          echo "Fresh server artifact not published" >&2
          exit 1
      - name: Build package from releases
        run: bash scripts/build-from-releases.sh
        env:
          WB_RELEASE_TOKEN: ${{ secrets.WB_RELEASE_TOKEN }}
          VERSION: ${{ inputs.version || '0.2.8' }}
      - uses: actions/upload-artifact@v4
        with:
          name: wb-package
          path: wb-*.wbpkg
      - name: Publish downloadable release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version || '0.2.8' }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "wb-${VERSION}.wbpkg" --clobber
          else
            gh release create "$TAG" "wb-${VERSION}.wbpkg" --title "WB ${VERSION}" --notes-file CHANGELOG.md
          fi
