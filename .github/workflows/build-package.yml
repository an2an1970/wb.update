name: Build WB Package
on:
  workflow_dispatch:
    inputs:
      version:
        required: true
        default: "0.1.0"
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -v
      - name: Build package from releases
        run: bash scripts/build-from-releases.sh
        env:
          WB_RELEASE_TOKEN: ${{ secrets.WB_RELEASE_TOKEN }}
          VERSION: ${{ inputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: wb-package
          path: wb-*.wbpkg
      - name: Publish downloadable release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "wb-${VERSION}.wbpkg" --clobber
          else
            gh release create "$TAG" "wb-${VERSION}.wbpkg" --title "WB ${VERSION}" --notes "WB deployment package. Unsigned test release; firmware not flashed by installer."
          fi
