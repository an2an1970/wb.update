name: Build WB Package
on:
  push:
    tags:
      - 'v*.*.*'
permissions:
  contents: write
concurrency:
  group: wb-release-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Validate release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 scripts/validate-release.py --tag "$RELEASE_TAG" --notes-file release-notes.md
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
      - run: python3 -m unittest discover -s tests -v
      - name: Reject existing release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to overwrite" >&2
            exit 1
          fi
      - name: Build package from pinned component releases
        env:
          WB_RELEASE_TOKEN: ${{ secrets.WB_RELEASE_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${VERSION#v}"
          export VERSION
          bash scripts/build-from-releases.sh
          python3 packager/build.py verify "wb-${VERSION}.wbpkg"
      - uses: actions/upload-artifact@v4
        with:
          name: wb-package-${{ github.ref_name }}
          path: wb-*.wbpkg
      - name: Publish immutable-version release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          gh release create "$RELEASE_TAG" "wb-${VERSION}.wbpkg" \
            --title "WB ${VERSION}" --notes-file release-notes.md --verify-tag
